name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
      - name: Checkout docs submodule
        shell: bash
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "atlas"
          git config --global pull.rebase false
          git submodule add https://github.com/swisskyrepo/PayloadsAllTheThings/ docs
          mv docs/.github/overrides .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-git-committers-plugin "mkdocs-material[imaging]" mdx_truly_sane_lists
      - name: Patch site_url for the fork
        run: sed -i 's#https://swisskyrepo.github.io/PayloadsAllTheThings#https://tanlysgy.github.io/PayloadsAllTheThings#' mkdocs.yml
      - run: mkdocs build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
